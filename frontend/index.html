<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Skin Lesion Classifier</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Skin Lesion Classifier</h1>

        <p class="subtitle">
            Upload an image to get a prediction from our
            EfficientNetB0 deep learning model.
        </p>

        <div class="upload-box">

            <input
                type="file"
                id="imageInput"
                accept="image/*"
            >

            <label for="imageInput" class="upload-button">
                Choose Image
            </label>

            <p id="fileName">No image selected</p>

        </div>

        <div class="preview-container">
            <img
                id="imagePreview"
                src=""
                alt="Image Preview"
            >
        </div>

        <button id="predictButton">
            Predict
        </button>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <span>Analyzing image...</span>
        </div>

        <div id="result" class="result hidden">

            <h2>Prediction Result</h2>

            <p>
                Predicted Class:
                <strong id="predictedClass"></strong>
            </p>

            <p>
                Confidence:
                <strong id="confidence"></strong>%
            </p>

            <div class="confidence-bar">
                <div id="confidenceFill"></div>
            </div>
        </div>

        <button id="resetButton" class="hidden">
            Try Another Image
        </button>

        <p class="disclaimer">
            This project is an academic/research prototype and
            should not be used as a medical diagnosis.
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
